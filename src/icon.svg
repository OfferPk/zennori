<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bentoBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#24211e" />
      <stop offset="100%" stop-color="#141312" />
    </radialGradient>
    <linearGradient id="noriGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d4a3e" />
      <stop offset="50%" stop-color="#1b3329" />
      <stop offset="100%" stop-color="#0f2119" />
    </linearGradient>
    <linearGradient id="riceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ded8cb" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Bento Box Background -->
  <rect width="512" height="512" rx="104" fill="url(#bentoBg)" />

  <!-- Wooden Bento Rim -->
  <rect x="52" y="52" width="408" height="408" rx="28" fill="none" stroke="#4a3e35" stroke-width="7" />

  <!-- Lattice Bento Grid Lines -->
  <line x1="154" y1="52" x2="154" y2="460" stroke="#36312c" stroke-width="2" />
  <line x1="256" y1="52" x2="256" y2="460" stroke="#36312c" stroke-width="2" />
  <line x1="358" y1="52" x2="358" y2="460" stroke="#36312c" stroke-width="2" />
  <line x1="52" y1="154" x2="460" y2="154" stroke="#36312c" stroke-width="2" />
  <line x1="52" y1="256" x2="460" y2="256" stroke="#36312c" stroke-width="2" />
  <line x1="52" y1="358" x2="460" y2="358" stroke="#36312c" stroke-width="2" />

  <!-- Chamber Boundary Outlines (Thick Wooden Walls) -->
  <!-- Chamber 1: Top-Left 2x2 -->
  <rect x="62" y="62" width="184" height="184" rx="8" fill="none" stroke="#8a7765" stroke-width="4" opacity="0.6" />
  <!-- Chamber 2: Right 2x2 -->
  <rect x="266" y="62" width="184" height="184" rx="8" fill="none" stroke="#8a7765" stroke-width="4" opacity="0.6" />

  <!-- Nori Domino 1 (Vertical Domino: 1x2 in left chamber) -->
  <g filter="url(#shadow)">
    <rect x="74" y="74" width="76" height="160" rx="14" fill="url(#noriGrad)" stroke="#3e6050" stroke-width="2" />
    <!-- Fine Roasted Seaweed Texture Flecks -->
    <line x1="84" y1="110" x2="140" y2="110" stroke="rgba(255,255,255,0.08)" stroke-width="2" stroke-linecap="round" />
    <line x1="84" y1="154" x2="140" y2="154" stroke="rgba(0,0,0,0.35)" stroke-width="2" stroke-linecap="round" />
    <line x1="84" y1="198" x2="140" y2="198" stroke="rgba(255,255,255,0.08)" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Nori Domino 2 (Horizontal Domino: 2x1 in bottom right) -->
  <g filter="url(#shadow)">
    <rect x="278" y="278" width="160" height="76" rx="14" fill="url(#noriGrad)" stroke="#3e6050" stroke-width="2" />
    <line x1="314" y1="288" x2="314" y2="344" stroke="rgba(255,255,255,0.08)" stroke-width="2" stroke-linecap="round" />
    <line x1="358" y1="288" x2="358" y2="344" stroke="rgba(0,0,0,0.35)" stroke-width="2" stroke-linecap="round" />
    <line x1="402" y1="288" x2="402" y2="344" stroke="rgba(255,255,255,0.08)" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Tactile Pearl Rice Dots (Empty Cells) -->
  <circle cx="204" cy="112" r="9" fill="url(#riceGrad)" opacity="0.85" />
  <circle cx="204" cy="214" r="9" fill="url(#riceGrad)" opacity="0.85" />
  <circle cx="306" cy="112" r="9" fill="url(#riceGrad)" opacity="0.85" />
  <circle cx="408" cy="112" r="9" fill="url(#riceGrad)" opacity="0.85" />
  <circle cx="306" cy="214" r="9" fill="url(#riceGrad)" opacity="0.85" />
  <circle cx="408" cy="214" r="9" fill="url(#riceGrad)" opacity="0.85" />
  <circle cx="112" cy="306" r="9" fill="url(#riceGrad)" opacity="0.85" />
  <circle cx="214" cy="306" r="9" fill="url(#riceGrad)" opacity="0.85" />
  <circle cx="112" cy="408" r="9" fill="url(#riceGrad)" opacity="0.85" />
  <circle cx="214" cy="408" r="9" fill="url(#riceGrad)" opacity="0.85" />

  <!-- Japanese Kanji Inscription: 海苔 • ノリノリ -->
  <text x="256" y="482" text-anchor="middle" font-family="'Noto Serif JP', 'Cinzel', serif" font-size="28" font-weight="600" fill="#a89a88" letter-spacing="6">海苔 • ノリノリ</text>
</svg>
